# Publishes the package to npm via Trusted Publishing (OIDC).
#
# No npm token is stored in GitHub: the workflow proves its identity to npm
# through a GitHub OIDC token (`id-token: write`), and npm accepts the publish
# because this repo/workflow is registered as a trusted publisher for the
# package. Provenance attestations are generated automatically.
#
# One-time setup on npmjs.com (package or org settings → Trusted Publisher):
#   Publisher:         GitHub Actions
#   Organization/user: ganso-technologies        (the GitHub org, not the npm org)
#   Repository:        astro-datasource-gitlab
#   Workflow filename: publish.yml
#   Environment:       (leave empty)
#
# Runs when you publish a GitHub Release, or manually via Actions → Run
# workflow. Each release must use a new version: bump "version" in
# package.json first — npm rejects re-publishing an existing version.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Authenticates via OIDC — no NPM_TOKEN involved.
      - run: pnpm publish --no-git-checks
